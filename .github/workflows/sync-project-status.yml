name: Auto Sync Project Statuses & Mirror

on:
  schedule:
    - cron: '0 4 * * *' # Täglich um 04:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [project-release-updated]

permissions:
  contents: write

jobs:
  sync-and-mirror:
    name: Sync Project Status & Mirror to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Project Status Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_projects.py

      - name: Commit and Push if Changed
        run: |
          if [ -n "$(git status --porcelain js/data.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/data.js
            git commit -m "chore(sync): auto-update project release tags and status from repos"
            git push origin main
          else
            echo "No changes in project statuses."
          fi
